name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i ac
        run: unzip -q VakitPro.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK derle
        run: gradle -p VakitPro assembleRelease --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VakitPro-apk
          path: VakitPro/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
